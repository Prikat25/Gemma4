name: gemma4-swe-agent-e5
version: 0.1.0
model: "gemma-4-31b-it-qat-w4a16-ct"

model_config:
  base_model: "gemma-4-31b-it-qat-w4a16-ct"
  quantization: "W4A16_CT"
  experiment_id: "E5"

description: "Experiment E5: E4 + iterative validation repair loop + read-only repository_researcher agent_tool."

instruction: "prompts/system.md"

tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph

agent_tools:
  - name: repository_researcher
    config: "sub_agents/repository_researcher.yaml"

skills:
  - swe_reasoning
  - repository_navigation
  - bug_patterns
  - testing

generation_config:
  temperature: 0.2
  max_output_tokens: 4096

execution_policy:
  max_repair_iterations: 3
  require_plan_before_edit: true
  run_targeted_tests_first: true
  run_regression_tests: true
  submit_only_after_validation: true

adapter: null
