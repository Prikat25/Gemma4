experiment_id: "E5"
description: "Master configurable experiment configuration (Default: E5 Full Base Architecture without LoRA)"

model:
  name: "gemma-4-31b-it-qat-w4a16-ct"
  temperature: 0.2
  max_output_tokens: 4096

architecture:
  use_logger: true
  use_function_summarizer: true
  use_bug_lookup: true
  use_flow_graph: true
  use_planner: true
  use_researcher: true
  use_validator: true
  use_failure_analyzer: true

retrieval:
  use_local_bug_db: true
  use_external_knowledge: false
  max_results: 5
  evidence_hierarchy:
    - repository_source
    - repository_tests
    - function_and_flow_knowledge
    - local_bug_database
    - external_docs

repository:
  summarize_functions: true
  summarize_classes: true
  build_call_graph: true
  build_flow_graph: true
  summarize_tests: true
  persistent_cache: true

planning:
  require_explicit_plan: true
  require_evidence: true
  max_plan_iterations: 2
  forbid_code_edits: true

coding:
  max_files_changed: 5
  require_diff_review: true

validation:
  run_targeted_tests_first: true
  run_broader_tests_after_targeted: true
  max_repair_iterations: 3

context:
  max_function_summaries: 30
  max_tests: 10
  max_flow_nodes: 50
  max_bug_matches: 5
  max_research_results: 5

time:
  total_budget_hours: 12
  total_budget_minutes: 720
  reserve_percentage: 10
  reserve_minutes: 60
  task_allocation:
    simple: 10
    medium: 20
    complex: 40
  complexity_weights:
    relevant_file_count: 0.30
    flow_depth: 0.25
    test_count: 0.20
    dependency_count: 0.15
    issue_length: 0.10

training:
  use_lora: false
  adapter: null
  verify_vllm_layer_registration: true
