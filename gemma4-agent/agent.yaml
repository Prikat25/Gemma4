name: gemma4_swe_agent
model: "gemma-4-31b-it-qat-w4a16-ct"

generate_content_config: !include configs/experiment.yaml

description: "Autonomous SWE Agent for Google Gemma 4 Developer Agent competition built on Gemma 4 31B IT QAT W4A16 CT with ADK-compliant tools, read-only researcher AgentTool, and iterative test-repair loop."

instruction: !include prompts/system.md

# Official competition sandbox tools provided by Kaggle swegemma
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/researcher.yaml
      skip_summarization: true

sub_agents:
  - config_path: sub_agents/researcher.yaml
  - config_path: sub_agents/planner.yaml
  - config_path: sub_agents/coder.yaml
  - config_path: sub_agents/validator.yaml

skills:
  - skills/swe-reasoning
  - skills/repository-navigation
  - skills/testing
  - skills/bug-patterns
  - skills/bug-lookup
  - skills/coding

include_contents: "default"

adapter: main_lora
