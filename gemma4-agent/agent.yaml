name: gemma4-swe-agent
version: 0.1.0
model: "gemma-4-31b-it-qat-w4a16-ct"

model_config:
  base_model: "gemma-4-31b-it-qat-w4a16-ct"
  quantization: "W4A16_CT"
  config_ref: "configs/experiment.yaml"

description: "Autonomous SWE Agent for Google Gemma 4 Developer Agent competition built on Gemma 4 31B IT QAT W4A16 CT with ADK-compliant tools, read-only researcher AgentTool, and iterative test-repair loop."

instruction: "prompts/system.md"

# Official competition sandbox tools provided by Kaggle swegemma
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph

# Optional read-only researcher sub-agent tool
agent_tools:
  - name: repository_researcher
    config: "sub_agents/repository_researcher.yaml"

skills:
  - swe_reasoning
  - repository_navigation
  - testing
  - bug_patterns

generation_config:
  temperature: 0.2
  max_output_tokens: 4096

execution_policy:
  max_repair_iterations: 3
  run_targeted_tests_first: true
  run_regression_tests: true
  submit_only_after_validation: true
  forbid_test_edits: true

adapter: null
